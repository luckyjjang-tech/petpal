<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>펫팔 Petpal — 동작 시제품 v0.1</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand"><span class="brand-en">Petpal</span><span class="brand-kr">펫팔</span></div>
    <div class="ver">시제품 v0.1</div>
  </header>

  <main class="stage" id="stage" data-event="sun">
    <div class="sky" aria-hidden="true"></div>
    <div class="rain" aria-hidden="true"></div>
    <div class="ground" aria-hidden="true"></div>

    <div class="eventChip" id="eventChip">
      <span class="eventIco" id="eventIco"></span>
      <span class="eventTx" id="eventText"></span>
    </div>

    <div class="effects" id="effects" aria-hidden="true"></div>

    <div class="petwrap" id="petWrap">
      <div class="bubble" id="bubble" hidden></div>
      <div class="petSlot" id="petSlot"></div>
    </div>

    <p class="narration" id="narration"></p>
  </main>

  <section class="panel">
    <div class="who">
      <span class="name" id="whoName">이름</span>
      <span class="meta" id="whoMeta"></span>
    </div>

    <div class="bars">
      <div class="barRow">
        <span class="bl">배부름</span>
        <span class="track"><i id="barFull" class="full"></i></span>
        <span class="bv" id="numFull">0</span>
      </div>
      <div class="barRow">
        <span class="bl">기분</span>
        <span class="track"><i id="barMood" class="mood"></i></span>
        <span class="bv" id="numMood">0</span>
      </div>
      <div class="barRow">
        <span class="bl">성장</span>
        <span class="track"><i id="barGrow" class="grow"></i></span>
        <span class="bv" id="numGrow">새끼</span>
      </div>
    </div>
    <p class="stall" id="stall" hidden></p>
  </section>

  <section class="controls">
    <div class="careRow">
      <button type="button" class="care" id="btnFeed">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3.2 11.6h17.6a1 1 0 0 1 1 1.1C21.3 17.3 17.4 20.6 12 20.6S2.7 17.3 2.2 12.7a1 1 0 0 1 1-1.1Z" fill="currentColor"/>
          <circle cx="9" cy="9.4" r="1.5" fill="#fff" opacity=".85"/>
          <circle cx="13" cy="8.6" r="1.4" fill="#fff" opacity=".85"/>
          <circle cx="16.4" cy="9.6" r="1.3" fill="#fff" opacity=".85"/>
        </svg>
        <span>밥</span>
      </button>
      <button type="button" class="care" id="btnWater">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3.2c.4 0 .7.2.9.5 1.3 2.1 5.2 8 5.2 10.6a6.1 6.1 0 0 1-12.2 0c0-2.6 3.9-8.5 5.2-10.6.2-.3.5-.5.9-.5Z" fill="currentColor"/>
        </svg>
        <span>물</span>
      </button>
      <button type="button" class="care" id="btnWalk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <ellipse cx="12" cy="15.8" rx="5.1" ry="4.2" fill="currentColor"/>
          <ellipse cx="6.6" cy="10.6" rx="2.1" ry="2.4" fill="currentColor"/>
          <ellipse cx="10" cy="7.8" rx="2.1" ry="2.5" fill="currentColor"/>
          <ellipse cx="14" cy="7.8" rx="2.1" ry="2.5" fill="currentColor"/>
          <ellipse cx="17.4" cy="10.6" rx="2.1" ry="2.4" fill="currentColor"/>
        </svg>
        <span>산책</span>
      </button>
      <button type="button" class="care" id="btnPet">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 20.6c-.4 0-.8-.2-1.1-.4C6.6 17 3.4 13.9 3.4 10.4 3.4 7.5 5.7 5.3 8.4 5.3c1.5 0 2.8.7 3.6 1.8.8-1.1 2.1-1.8 3.6-1.8 2.7 0 5 2.2 5 5.1 0 3.5-3.2 6.6-7.5 9.8-.3.2-.7.4-1.1.4Z" fill="currentColor"/>
        </svg>
        <span>쓰다듬</span>
      </button>
    </div>

    <button type="button" class="call" id="callBtn">이름을 지어 주세요</button>
    <p class="hint" id="callHint"></p>
  </section>

  <footer class="tools">
    <button type="button" class="tool" id="skipBtn">하루 지나가기</button>
    <span class="dot">·</span>
    <button type="button" class="tool" id="resetBtn">다시 분양받기</button>
    <span class="calls" id="callCount"></span>
  </footer>
  <p class="protoNote">시험용 설정 · 성장 속도는 실제 설계(약 1년)보다 빠르게, 날씨는 임시 데이터입니다.</p>

  <div class="errBar" id="errBar" hidden></div>

</div>

<!-- 분양 → 이름 -->
<div class="overlay" id="adopt" hidden>
  <div class="sheet">

    <div class="step" id="stepBreed">
      <h1>어떤 아이를 분양받을까요?</h1>
      <p class="lead">품종마다 생김새와 다 자랐을 때의 크기가 달라요.<br />한 마리를 고르면 그 품종의 새끼가 옵니다.</p>

      <p class="groupTitle">강아지</p>
      <div class="grid" id="gridDog"></div>

      <p class="groupTitle">고양이</p>
      <div class="grid" id="gridCat"></div>

      <button type="button" class="primary" id="breedOk" disabled>이 아이로 할게요</button>
      <p class="fine">짱이 만든 동작 시제품 v0.1 · 계정·서버·결제 없이 이 브라우저에만 저장됩니다.</p>
    </div>

    <div class="step" id="stepName" hidden>
      <div class="picked" id="pickedArt"></div>
      <h1 id="stepNameTitle">이름을 지어 주세요</h1>
      <p class="lead" id="stepNameLead"></p>
      <input id="nameInput" type="text" maxlength="8" placeholder="예: 몽이" autocomplete="off" spellcheck="false" />
      <button type="button" class="primary" id="nameOk" disabled>이 이름으로 부를게요</button>
      <button type="button" class="ghost" id="backBtn">품종 다시 고르기</button>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
